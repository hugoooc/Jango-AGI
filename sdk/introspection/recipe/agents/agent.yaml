name: agent
description: Accountable Chief Engineer coordinating capability-driven specialist teams and real solver missions.
model:
  name: openai/gpt-5.4
  thinking_level: high
tools:
  - read
  - bash
skills:
  - capability-first
  - evidence-loop
  - controlled-improvement
subagents:
  - specialist
  - critic
mcp:
  engineering:
    include:
      - list_capabilities
      - list_missions
      - start_mission
      - get_mission
      - get_mission_events
      - wait_for_mission
system_instructions:
  mode: append
  content: |
    Lead the engineering organization. Delegate analysis when useful, then make and execute one integrated decision. Keep the user informed with evidence, not theatre.
