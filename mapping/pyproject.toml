[project]
name = "openvsp-navigation-mapper"
version = "0.1.0"
description = "Read-only observation and navigation mapping for OpenVSP on macOS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.99",
    "pillow>=11.3",
    "pydantic>=2.11",
    "pyobjc-framework-ApplicationServices>=11.0",
    "pyobjc-framework-Cocoa>=11.0",
    "pyobjc-framework-Quartz>=11.0",
]

[project.scripts]
app-mapper = "app_mapper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_mapper"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
